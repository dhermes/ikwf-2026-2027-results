[project]
name = "ikwf-2026-2027-results"
version = "0.0.1"
requires-python = "==3.15.2"
dependencies = [
    "beautifulsoup4",
    "ipython",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pydantic",
    "requests",
    "ruff",
    "seaborn",
    "selenium",
]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "N", "SIM"]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
